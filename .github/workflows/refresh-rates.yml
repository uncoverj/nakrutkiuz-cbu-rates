name: Refresh official CBU rates

on:
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate CBU rates
        run: python3 fetch_rates.py
      - name: Publish latest snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official CBU rates'
            git push
          fi
